[variables]
NIXPACKS_PHP_ROOT_DIR = "public"

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[start]
cmd = "php artisan migrate --force && php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan storage:link --quiet 2>/dev/null; apache2-foreground"
